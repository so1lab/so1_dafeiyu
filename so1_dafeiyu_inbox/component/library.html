<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"><title>大肥鱼仓库</title><link rel="stylesheet" href="shell-ui.css"><link rel="stylesheet" href="library.css">
<header><div class="fish-brand"><img class="fish-logo" src="dafeiyu-default.png" alt=""><h1>大肥鱼仓库</h1></div><input type="search" id="query" placeholder="搜索文件、项目或内容" aria-label="搜索整个仓库"><button id="recent">移动历史</button><details id="more"><summary aria-label="更多操作">•••</summary><div><a href="replay.html">收纳回放</a><button id="root">打开资源管理器</button></div></details></header>
<nav><div id="crumb"></div><select id="media" aria-label="媒体类型"><option value="">全部类型</option><option>图片</option><option>视频</option><option>音频</option></select><label id="pendingLabel" hidden><input type="checkbox" id="pending">待确认</label><button id="view">缩略图</button></nav>
<main><section><h3>资料库</h3><div id="quick"></div><h3>常用位置</h3><div id="dock"></div><details id="directories"><summary>浏览所有目录</summary><div id="places"></div></details></section><section id="subcol"><h3>子文件夹</h3><div id="subs"></div></section><article><div class="bar"><h2 id="title"></h2><button id="pin">固定此处</button></div><div class="bar"><small id="count"></small></div><div id="labels"><span>文件名</span><span>位置</span><span>收纳时间</span></div><div id="files" tabindex="0"></div></article></main>
<footer hidden><div id="selection"><strong id="selectedCount"></strong><button id="to">移动到…</button><button id="clear">取消选择</button></div><div class="bar"><span id="feedback" role="status"></span><div id="receipt"></div></div></footer>
<dialog id="preview"><button id="dismiss">关闭预览</button><div id="detail"></div></dialog><dialog id="picker"><div class="bar"><h2 id="modalTitle">移动到</h2><button id="close">关闭</button></div><input type="search" id="find" placeholder="搜索目标完整路径"><div id="choices"></div></dialog><script src="library-ui.js"></script></html>
