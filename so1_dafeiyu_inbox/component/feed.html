<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
  <title>我的算力推荐</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 25px 22px; background: #f2f6fc; color: #1f3150;
      font: 14px/1.6 "Microsoft YaHei UI", "Segoe UI", sans-serif;
    }
    main { max-width: 370px; margin: 0 auto; }
    h1 { margin: 0; font-size: 24px; line-height: 1.3; }
    p { margin: 7px 0 0; color: #485970; }
    strong { color: #234d9f; }
    figure {
      margin: 16px 0 0; padding: 12px 12px 10px; background: #fff;
      border: 1px solid #dfe7f3; border-radius: 16px; text-align: center;
    }
    img { display: block; width: min(100%, 220px); height: auto; margin: 0 auto; }
    figcaption { margin-top: 6px; font-size: 13px; color: #485970; }
    .ref { margin-top: 10px; text-align: center; color: #405371; }
    code { margin-left: 5px; font: 600 14px Consolas, monospace; color: #234d9f; }
  </style>
</head>
<body>
  <main>
    <h1>我的算力推荐</h1>
    <p>智算方舟由国企运营，提供 DeepSeek、GLM 等主流大模型的 Token 月套餐。</p>
    <p>现在登录还能<strong>免费领 30 万算力点</strong>，价格只有官方 API 的 <strong>1/2 到 1/4</strong>。大肥鱼用着不烧心。</p>
    <figure>
      <img src="fangzhou-qr.jpg" width="750" height="1080" alt="智算方舟推广二维码">
      <figcaption>扫码了解智算方舟</figcaption>
    </figure>
    <p class="ref">守一的推广码 <code>XBnapu5a</code></p>
  </main>
</body>
</html>
